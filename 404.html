<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在 | 栈顶工作室 STACKTOP</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2304050a'/%3E%3Cpath d='M36 34 L22 50 L36 66' fill='none' stroke='%2322d3ee' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M64 34 L78 50 L64 66' fill='none' stroke='%23a78bfa' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#04050a;color:#e2e8f0;padding:24px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60rem 40rem at 15% -10%, rgba(34,211,238,.13), transparent 60%),
      radial-gradient(50rem 40rem at 85% 5%, rgba(139,92,246,.13), transparent 60%);
  }
  .wrap{max-width:520px;width:100%;text-align:center}
  .code{
    font-family:'JetBrains Mono',Consolas,Menlo,monospace;
    font-size:clamp(64px,18vw,110px);font-weight:700;line-height:1;
    background:linear-gradient(100deg,#a5f3fc,#22d3ee 32%,#818cf8 66%,#c4b5fd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{margin-top:18px;font-size:20px;font-weight:600;color:#fff;letter-spacing:.01em}
  p{margin-top:12px;font-size:14px;line-height:1.7;color:#94a3b8}
  .actions{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  a.btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:14px;padding:12px 22px;font-size:14px;font-weight:600;
    text-decoration:none;transition:transform .2s ease,filter .2s ease;
  }
  a.primary{background:linear-gradient(100deg,#67e8f9,#22d3ee 45%,#a78bfa);color:#04050a}
  a.ghost{color:#e2e8f0;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045)}
  a.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .foot{margin-top:34px;font-size:12px;color:#475569}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能拼错了，或者页面已经被移走。<br>回首页看看，或者直接找我聊需求。</p>
    <div class="actions">
      <a class="btn primary" href="/">回到首页</a>
      <a class="btn ghost" href="/#contact">联系开发者</a>
    </div>
    <p class="foot">栈顶工作室 STACKTOP · 独立全栈开发</p>
  </main>
</body>
</html>
